name: Publish (timezone)

on:
  push:
    tags:
      - "timezone-v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          no-cache: true

      - run: bun install --frozen-lockfile

      - run: mkdir -p packages/timezone/node_modules && ln -sfn "$PWD" packages/timezone/node_modules/mmntjs

      - run: bun run knip
      - run: bun run fallow

      - name: Build root (required by timezone peerDep)
        run: bun run build

      - name: Build timezone
        run: cd packages/timezone && bun run build

      - name: Verify timezone dist files
        run: |
          test -f packages/timezone/dist/index.js
          test -f packages/timezone/dist/index.cjs
          test -f packages/timezone/dist/index.d.ts
          test -f packages/timezone/dist/index.d.cts
          test -f packages/timezone/dist/logic.js
          test -f packages/timezone/dist/1970-2030.js

      - name: Run timezone runtime smoke
        run: TZ=UTC bun test ./packages/timezone/test/runtime-smoke.test.ts

      - name: Dry-run pack
        run: cd packages/timezone && npm pack --dry-run

      - name: Publish
        run: cd packages/timezone && npm publish --access public
