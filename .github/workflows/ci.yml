name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".github/workflows/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: mkdir -p packages/timezone/node_modules && ln -sfn "$PWD" packages/timezone/node_modules/mmntjs
      - run: bun run build
      - run: bun run lint
      - run: TZ=UTC bun run test:hard
      - run: bun run knip
      - run: bun run fallow
      - run: bun run test:coverage
      - name: "Check coverage threshold (target: 80%)"
        run: bun scripts/check-coverage.ts 80
