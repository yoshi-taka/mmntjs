name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
      - run: TZ=UTC bun run test:hard
      - run: bun run knip
      - run: bun run fallow

      - run: bun run test:coverage
      - name: "Check coverage threshold (target: 80%)"
        run: bun scripts/check-coverage.ts 74
