pre-commit:
  commands:
    lint:
      run: bun run lint
    audit:
      run: bun run audit:static

pre-push:
  commands:
    confirm:
      run: |
        if [ "$PUSH_OK" = "1" ]; then
          exit 0
        fi
        echo ""
        echo "=============================================="
        echo "  git push 禁止: PUSH_OK=1 をセットして実行せよ"
        echo "  例: PUSH_OK=1 git push origin <branch>"
        echo "=============================================="
        exit 1
