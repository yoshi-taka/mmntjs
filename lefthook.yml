pre-commit:
  commands:
    lint:
      run: bun run lint
    audit:
      run: bun run audit:static

pre-push:
  commands:
    confirm:
      run: |
        echo ""
        echo "=============================================="
        echo "  git push 禁止: エージェントにpushさせるな"
        echo "  必要な場合は手動で: git push origin <branch>"
        echo "=============================================="
        exit 1
